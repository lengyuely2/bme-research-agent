[project]
name = "bio-research-agent"
version = "0.5.1"
description = "Local-first biomedical research assistant with a bounded evidence broker"
requires-python = ">=3.11"
dependencies = ["openai>=2.0,<3", "pypdf>=6.0,<7", "httpx>=0.28,<1", "matplotlib>=3.9,<4", "pillow>=11,<13", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "pypdfium2>=4,<6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
bio-research-agent = "bioagent.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bioagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
